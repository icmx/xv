[[redirects]]
  from = "/api/comics/xkcd/*"
  to = "https://xkcd.com/:splat"
  status = 200

[[redirects]]
  from = "/files/comics/xkcd/*"
  to = "https://imgs.xkcd.com/comics/:splat"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
